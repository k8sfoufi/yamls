apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: todo-db
  namespace: abdelatif
  labels: { app: todo-db }
spec:
  serviceName: todo-db
  replicas: 1
  selector:
    matchLabels: { app: todo-db }
  template:
    metadata:
      labels: { app: todo-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_DB
              value: tododb
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: todo-db-secret, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: todo-db-secret, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: todo-db
  namespace: abdelatif
spec:
  selector: { app: todo-db }
  ports:
    - port: 5432
      targetPort: pg
