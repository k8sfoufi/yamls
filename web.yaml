apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: abdelatif
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: abdelatifaiteur/todo-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: abdelatif
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: http
