apiVersion: apps/v1
kind: Deployment
metadata:
  name: info-api
  namespace: todo-app
  labels: { app: info-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: info-api }
  template:
    metadata:
      labels: { app: info-api }
    spec:
      containers:
        - name: info-api
          image: info-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: info-db-secret, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: info-db-secret, key: password } }
            - name: ConnectionStrings__Default
              value: Host=info-db;Port=5432;Database=infodb;Username=$(DB_USER);Password=$(DB_PASSWORD)
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: info-api
  namespace: todo-app
spec:
  selector: { app: info-api }
  ports:
    - port: 8080
      targetPort: http
