apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo-app
spec:
  ingressClassName: nginx
  rules:
    - host: todo-app.localtest.me   # resolves to 127.0.0.1; change to your own domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
