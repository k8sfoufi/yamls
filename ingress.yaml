apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: abdelatif
spec:
  ingressClassName: traefik
  rules:
    - host: todo-app.abdelatif.195.35.2.222.nip.io   # resolves to 127.0.0.1; change to your own domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
